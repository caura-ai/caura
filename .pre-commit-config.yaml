# Mirrors the checks .github/workflows/ci.yml runs so a local commit
# catches the same formatting / lint / type issues CI would reject.
# Enable locally with: ``pip install pre-commit && pre-commit install``.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # The ruff every service's uv.lock pins, so at least each pyproject's
    # ruff floor.
    rev: v0.16.10
    hooks:
      # The trees ci.yml lints and format-checks. ruff reads each file's
      # nearest config, as it does in CI.
      - id: ruff-check
        args: [--fix]
        files: '^(common|scripts|tests|core-(api|storage-api|operations|worker)/(src|tests))/'
      - id: ruff-format
        files: '^(scripts|tests|core-(api|storage-api|operations|worker)/(src|tests))/'
      # In common/, CI format-checks only the three files vendored from
      # caura-enterprise, and at ruff's defaults.
      - id: ruff-format
        name: ruff-format (vendored common/ files, ruff defaults)
        args: [--isolated]
        files: '^common/(__init__|structlog_config|serve)\.py$'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

# mypy intentionally NOT run via pre-commit: the mirrors-mypy hook runs in
# its own isolated env that can't see core-api / core-storage-api workspace
# deps, so it either false-positives on unresolved imports or silently
# under-checks. CI (``cd core-api && uv run mypy src/``) runs inside the
# real project venv and is the authoritative type-check.
