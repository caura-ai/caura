[format]
quote-style = "double"
indent-style = "space"
# EXCLUDED FROM ``ruff format`` ONLY. Every file below is still fully
# lint-checked by the ``[lint]`` section above; only the formatter is held off.
#
# THE RULE, and it is one rule rather than 7 judgements: the formatter may not
# touch a file that carries a line-level ``legacy-name-ok`` or
# ``legacy-name-floor`` marker. ``legacy_name_ratchet.py`` greps LINE BY LINE — a
# marker exempts the line it sits on and nothing else. When ``ruff format`` wraps
# a marked statement past 88 columns, the legacy name goes to one line and the
# trailing comment to another, so the name lands on an UNMARKED line. The ratchet
# then reports the marker deleted and the name newly minted, and fails.
#
# MEASURED on this change before these exclusions existed: 11 markers displaced
# across 6 files, ratchet exit 1, reporting 11 exemptions removed and the legacy
# name "added" in 6 files that nobody had semantically touched.
#
# Re-attaching each comment to its name's line does NOT converge. Ruff's
# preferred layout for three of those sites puts the trailing comment on a line
# that does not hold the name at all — the ``1,`` of a ``replace()`` call, the
# blank-string argument of a ``setenv()``, the right-hand side of a comparison —
# so every reformat displaces it again. Verified by doing it and re-running both
# gates.
#
# Two things this buys beyond a green build. The pre-commit ruff-format hook
# reads this list too, so it can no longer displace a marker on someone's
# unrelated commit — a live trap, not a hypothetical, since that hook is what
# formats these files today. And ``legacy_name_ratchet.py`` and
# ``do_not_touch_sentinel.py`` are byte-identical fleet-wide with their content
# owned elsewhere; "never reformat these two" was a rule people had to remember,
# and is now a rule the config enforces.
#
# THE FIX THAT REMOVES AN ENTRY: hoist the legacy literal into a short
# module-level constant carrying the marker, so no wrap is possible.
# ``tests/_legacy_contracts.py`` exists for exactly that and already holds four.
# It is a change to test and script code, deliberately not bundled into a
# lint-coverage change. Delete an entry once its file has no in-line marker left.
exclude = [
    # markers: 1 — the legacy dual-read env prefix, inside a replace() call
    "_env_compat.py",
    # markers: 1
    "_f3_wet_test_observer.py",
    # markers: 1
    "benchmark_blend_locomo.py",
    # markers: 45 — and byte-identical fleet-wide; content owned elsewhere
    "do_not_touch_sentinel.py",
    # markers: 4 — incl. the old plugin's tools-file heading inside an `or (...)`
    "gateway_integration_test.py",
    # markers: 8 — the engine itself; byte-identical fleet-wide
    "legacy_name_ratchet.py",
    # markers: 1
    "wet_test_direction_invariance.py",
]
