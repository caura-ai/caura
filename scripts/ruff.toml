# Ruff contract for repo-root scripts/ — pinned deliberately, and the sibling of
# scripts/mypy.ini. Same tree, same reasoning; that file gates types, this one
# gates lint and format.
#
# WHY THIS FILE EXISTS: scripts/ appeared in NO ruff scope in ci.yml, and the
# repo has no root [tool.ruff], so `ruff check scripts/` had no ancestor config
# and fell back to ruff's BUILT-IN defaults. The effective rule set was
# "whatever the installed ruff version happens to ship" — which is not stable:
# the defaults expanded from 59 to 413 rules across the 0.16 bump (OSS #684,
# enterprise #879/#898). That is what prompted common/ruff.toml here; scripts/
# never got the same treatment.
#
# It bites in a specific way. With CI not linting scripts/ at all, the only gate
# was the pre-commit ruff hook, which runs per CHANGED FILE. So a ruff bump
# plants findings in files nobody is touching, and they surface later as a
# blocked commit for whoever edits one next, for reasons unrelated to their
# change. caura-enterprise hit exactly that on its #981 and worked around it
# with --no-verify; its scripts/ruff.toml is the fix this mirrors.
#
# WHY THIS RULE SET: byte-for-byte the select/ignore lists of
# caura-enterprise/scripts/ruff.toml, which is common/ruff.toml's proven list
# plus the families that catch real things in a scripts/ tree. Kept identical so
# a script moving between the two repos is not linted differently, and so the two
# files stay diffable. Each addition over common/ is load-bearing there and here:
#
#   * ``BLE`` — deliberate broad catches carry ``# noqa: BLE001``. Drop BLE and
#     every one becomes an unused-noqa error, and the deliberate breadth loses
#     the annotation documenting it.
#   * ``S`` — these scripts shell out and fetch URLs against real projects;
#     bandit's checks are worth more here than in library code.
#   * ``EXE``/``FURB``/``PLW`` — cheap, and each caught something real.
#
# ``line-length`` is 88 — ruff's own default, matching common/ruff.toml and
# enterprise's scripts/ruff.toml rather than the 110 used by core-*/src. Pinned
# rather than inherited, and MEASURED rather than assumed: at 88, 13 of 31 files
# want reformatting; at 110 it is 29, and at 200 it is still 29. These files were
# written by ``ruff format`` at its default width, so a wider limit does not
# accommodate them — it tells the formatter to JOIN lines that are correctly
# wrapped today, and makes the diff bigger. 88 is the minimum-churn value, not a
# compromise. Both fleet-wide engine files, legacy_name_ratchet.py and
# do_not_touch_sentinel.py, are already clean at it.
#
# E501 is ignored, as everywhere in this estate, so line-length governs
# ``ruff format`` only and never fails ``ruff check``.
line-length = 88
target-version = "py312"
exclude = [
    ".git", ".mypy_cache", ".pytest_cache", ".ruff_cache",
    ".venv", "__pycache__", "build", "dist",
]

[lint]
select = [
    "E", "W", "F", "I", "B", "BLE", "C4", "UP", "ARG",
    "SIM", "TCH", "PTH", "RUF", "ASYNC", "S", "EXE", "FURB", "PLW",
]
ignore = [
    # Mirrors common/ruff.toml's ignore list, so a rule that is noise in one
    # tree is not suddenly an error in the other.
    "E501", "TC001", "TC002", "TC003", "ARG001", "ARG002",
    "B008", "B904", "RUF022", "PTH123", "SIM117", "RUF012", "RUF009",
    # Inherent to what these scripts ARE, not defects to suppress one by one.
    # They drive gcloud/docker and fetch deploy URLs; that is the job. Flagging
    # it per call site would mean a noqa on every script added.
    #   S603 subprocess-without-shell-equals-true
    #   S607 start-process-with-partial-path  (``gcloud`` off PATH, deliberate)
    #   S310 suspicious-url-open-usage
    "S603", "S607", "S310",
]
fixable = ["ALL"]

[lint.per-file-ignores]
# The ratchet engine is byte-identical fleet-wide and another package owns its
# content, so its findings cannot be fixed here — the fix would have to land in
# every repo at once or the copies diverge. Contained rather than dropped from
# `select`, so the three families still bite in every other script.
#
# caura-enterprise/scripts/ruff.toml carries this same entry with the same three
# codes. Its comment explains itself as "vendored byte-for-byte from caura, whose
# CI does not apply this enterprise-only scripts rule set" — a sentence this
# change makes stale, since caura's CI now applies exactly that rule set. The
# entry stays correct in both; only enterprise's rationale needs a reword.
#
#   PLW0603 global _ACTIVE_CONFIG   (2 sites: the config is process-wide state)
#   PLW2901 loop variable overwritten (2 sites)
#   S101    assert used              (2 sites, in its self-check)
"legacy_name_ratchet.py" = ["PLW0603", "PLW2901", "S101"]


# ---------------------------------------------------------------------------
# BACKLOG — a ratchet, not a category. Shrink; never add.
#
# 145 findings in 24 files, listed BY NAME with the codes each one
# still trips and how many times. That shape is deliberate and it is the whole
# design: a file becomes exempt only by someone adding it here in a reviewed
# diff, never by being born in the right directory. scripts/mypy.ini reached
# the same conclusion for types in this same tree — its #983 review rejected a
# module-level ``ignore_errors``, and #998 tore out two globs covering 105
# modules to gate the 19 that actually failed. A glob here would silently
# swallow every future script.
#
# The gate is landing WITHOUT this backlog cleared, deliberately: landing a gate
# together with its backlog is how gates get reverted. What matters is that
# every file NOT listed here is gated as of this commit, and so is every file
