[project]
name = "caura-bus-mcp"
version = "0.2.0"
description = "MCP server exposing one opcode-based Caura peer tool over stdio"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Caura, Inc." }]
dependencies = [
    "caura-bus-core",
    "mcp>=2.1.1,<3",
]

[project.scripts]
caura-bus-mcp = "caura_bus_mcp.server:main"

[tool.uv.sources]
caura-bus-core = { workspace = true }

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
