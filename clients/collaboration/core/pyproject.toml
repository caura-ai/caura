[project]
name = "caura-bus-core"
version = "0.2.0"  # x-release-please-version
description = "Typed async Caura platform client and message schema"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Caura, Inc." }]
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27,<1",
    "ulid-py>=1.1",
]

[project.urls]
Homepage = "https://github.com/caura-ai/caura/tree/main/clients/collaboration"
Source = "https://github.com/caura-ai/caura"
Changelog = "https://github.com/caura-ai/caura/blob/main/clients/collaboration/CHANGELOG.md"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
