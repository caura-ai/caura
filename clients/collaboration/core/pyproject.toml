[project]
name = "caura-bus-core"
version = "0.2.0"
description = "Typed async Caura platform client and message schema"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Caura, Inc." }]
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27,<1",
    "ulid-py>=1.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
