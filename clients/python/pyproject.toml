[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "caura-client"
version = "1.0.1"
description = "Official Python client for Caura (formerly MemClaw; the memclaw_client import and MemClaw class remain permanent aliases) — governed shared memory for AI agent fleets (multi-agent, multi-tenant, MCP-native)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Caura", email = "hello@caura.ai" }]
keywords = [
    "caura",
    "memclaw",
    "agent-memory",
    "ai-agents",
    "llm-memory",
    "rag",
    "mcp",
    "knowledge-graph",
    "vector-search",
    "multi-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.scripts]
caura-interviewer = "caura_client.interviewer.cli:main"
# Legacy command name, kept forever — pre-rename cron entries invoke it.
memclaw-interviewer = "caura_client.interviewer.cli:main"

[project.optional-dependencies]
# ruff pinned to the 0.15 line (matches .pre-commit-config.yaml's v0.15.4): the
# client CI installs ruff from this extra and `ruff>=0.6` floated to 0.16, whose
# new default rules (RUF022, C408, …) fail on existing code. Adopting 0.16 is a
# deliberate follow-up (fix the 18 findings), not a silent CI-breaking float.
dev = ["pytest>=8", "ruff>=0.15.4,<0.16"]

[project.urls]
Homepage = "https://caura.ai"
Documentation = "https://caura.ai/docs"
Repository = "https://github.com/caura-ai/caura"
Issues = "https://github.com/caura-ai/caura/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
caura_client = ["py.typed"]

[tool.ruff]
target-version = "py39"
line-length = 110
src = ["src", "tests"]

[tool.pytest.ini_options]
# Self-contained config so the client suite doesn't inherit the repo-root
# pytest.ini (which configures pytest-asyncio for the backend services).
testpaths = ["tests"]
