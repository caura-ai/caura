# Metapackage holding the bare `caura` name on PyPI. Not a stub: it installs
# the real client and re-exports it, so `pip install caura` +
# `from caura import Caura` genuinely work.
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "caura"
version = "1.0.1"
description = "Caura (formerly MemClaw) — governed shared memory for AI agent fleets. Installs caura-client under the caura name."  # legacy-name-ok: taught as legacy alias
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Caura", email = "hello@caura.ai" }]
dependencies = ["caura-client>=1.0.0"]
keywords = [
    "caura",
    "agent memory",
    "ai agent memory",
    "shared memory",
    "multi-agent",
    "agent db",
    "agent fleet memory",
    "mcp",
    "mcp-server",
    "governed memory",
    "llm memory",
    "memclaw",  # legacy-name-ok: the former name, kept so searches for it still find Caura
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://caura.ai"
Documentation = "https://caura.ai/docs"
Source = "https://github.com/caura-ai/caura"
Issues = "https://github.com/caura-ai/caura/issues"
Changelog = "https://github.com/caura-ai/caura/tags"
Benchmark = "https://github.com/caura-ai/caura-longmemeval"

[tool.setuptools.packages.find]
where = ["src"]
