name: Client (Python) CI

on:
  pull_request:
    paths:
      - "clients/python/**"
      - ".github/workflows/client-python-ci.yml"
  push:
    branches: [main]
    paths:
      - "clients/python/**"
      - ".github/workflows/client-python-ci.yml"

# Dependency installs run here, on push to main too, so the token they could
# reach is read-only whatever the repository default is.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version pyproject.toml claims (requires-python >= 3.9, classifiers 3.9-3.14).
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        # Lint is version-independent (target-version = "py39"), so run it once.
        if: matrix.python-version == '3.12'
        run: ruff check src tests
      - name: Test (pytest)
        run: pytest -q
