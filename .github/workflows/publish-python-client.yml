name: Publish caura-client to PyPI

# Publishes the Python client SDK to PyPI via trusted publishing (OIDC — no token).
#
# One-time setup by a maintainer:
#   1. Create the PyPI project `caura-client` (this workflow builds and
#      publishes clients/python, whose distribution name is `caura-client`).
#   2. On PyPI, add a Trusted Publisher: repo `caura-ai/caura`,
#      workflow `publish-python-client.yml`, environment `pypi`.
#   3. Create a GitHub environment named `pypi`.
#
# Release: bump the version in clients/python/pyproject.toml, then push a tag
# `caura-client-v<version>` (or run this workflow manually).

on:
  push:
    tags:
      - "caura-client-v*"
      - "memclaw-client-v*" # legacy-name-ok: rule 3 keeps the published tag pattern working
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build
        working-directory: clients/python
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: clients/python/dist/
