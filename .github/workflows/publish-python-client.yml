name: Publish caura-client to PyPI

# Publishes the Python client SDK to PyPI via trusted publishing (OIDC — no token).
#
# One-time setup by a maintainer:
#   1. Create the PyPI project `caura-client` (this workflow builds and
#      publishes clients/python, whose distribution name is `caura-client`).
#   2. On PyPI, add a Trusted Publisher: repo `caura-ai/caura`,
#      workflow `publish-python-client.yml`, environment `pypi`.
#   3. Give the GitHub environment `pypi` required reviewers, and restrict its
#      deployment to the main branch and the four PyPI client tag patterns
#      (caura-client-v*, caura-sdk-v*, caura-meta-v* and the redirect shell's).
#      The other three PyPI client workflows share it.
#
# Release: bump the version in clients/python/pyproject.toml, then push a tag
# `caura-client-v<version>`, or run this workflow from main naming an existing
# tag. Either way the build job checks the tag is on main before building.

on:
  push:
    tags:
      - "caura-client-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re-)publish, e.g. caura-client-v1.1.1"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # The build has its own job, without `id-token: write`: GitHub hands the
  # token-request variables to every step of a job that holds it, so anything a
  # build installs there could mint a PyPI upload token (L-235). Its tools come
  # hash-pinned from .github/pypi-build/requirements.txt, and --no-isolation
  # builds with them instead of fetching the newest setuptools, so the files the
  # publish job uploads and attests are made by reviewed code.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          # The whole history, so main is there to compare the tag against.
          fetch-depth: 0
          persist-credentials: false
      # A tag can name any commit, and a release or a manual run can name any
      # tag. Build only a commit main already contains.
      - name: The tag must point at a commit on main
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::$(git rev-parse HEAD) is not on main. Only a tag on a commit main already contains is published."
            exit 1
          fi
          echo "$(git rev-parse HEAD) is on main"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # A tag that disagrees with pyproject.toml does not fail — it publishes
      # whatever pyproject.toml says, under a tag claiming otherwise. The release
      # then looks done while PyPI serves a different version. A manual run
      # names its tag too, so it is checked the same way.
      - name: The tag must agree with pyproject.toml
        run: |
          TAG_VERSION="${RELEASE_TAG#caura-client-v}"
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "::error::tag ${RELEASE_TAG} says ${TAG_VERSION} but pyproject.toml says ${PKG_VERSION}"
            exit 1
          fi
          echo "publishing $(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")==${PKG_VERSION}"
        working-directory: clients/python
      # The README source carries legacy-name lint markers as HTML comments so
      # the rename ratchet can account for each mention of the former name. They
      # are not for readers: PyPI's JSON API serves the long description raw, so
      # they would leak into every page an AI answer engine reads. Strip them
      # before building, and refuse to publish if any HTML comment survives.
      - name: Strip lint markers from the README
        run: |
          sed -E -i 's/ *<!-- legacy-name-[a-z]+:[^>]*-->//g' README.md
          if grep -q '<!--' README.md; then
            echo "::error::README.md still contains an HTML comment; it would be published verbatim"
            exit 1
          fi
        working-directory: clients/python
      - name: Build
        run: |
          pip install --require-hashes -r "${GITHUB_WORKSPACE}/.github/pypi-build/requirements.txt"
          python -m build --no-isolation
        working-directory: clients/python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: clients/python/dist/
          if-no-files-found: error

  # Holds the permission, so past the credential check it runs only the
  # download and the pinned publish action.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI trusted publishing
    steps:
      # Fail before doing any work if this job cannot mint a publishing
      # credential at all. There is no stored token to check for trusted
      # publishing (the npm twins publish the same way now), so the
      # condition is whether GitHub is willing to issue an OIDC token — which it
      # signals by setting these two variables, and only when the job actually
      # holds `id-token: write`. Drop that permission while editing this file and
      # the run would otherwise get all the way to the publish action before
      # failing inside it, with the cause several layers down.
      #
      # Deliberately does NOT request a token. Minting one would additionally
      # prove the endpoint is healthy, but it puts a live credential in this
      # step for no gain the publish action does not already provide seconds
      # later — and the check exists to catch a misconfigured workflow, which
      # the variables answer on their own.
      - name: The publish credential must be obtainable
        run: |
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" ]]; then
            echo "::error::No OIDC token-request context, so PyPI trusted publishing cannot authenticate. This job needs 'permissions: id-token: write'; there is no stored token to fall back on."
            exit 1
          fi
          echo "OIDC token-request context is present"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  # After the upload, without the permission: it only reads the public index.
  verify:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # A green publish step is not evidence PyPI serves it. The npm twin carries
      # the same check after #870, where a version bump passed every gate and both
      # registries went on serving the old build — the tick meant "nothing went
      # wrong", not "it shipped". Ask the index. PyPI is not immediately
      # consistent, hence the retries.
      - name: PyPI must actually serve it
        run: |
          PKG_NAME=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          # Ask for the project and test membership, rather than requesting the
          # version URL directly: PyPI answers that 404 in a way curl reports as
          # exit 56 ("failure receiving network data"), which is indistinguishable
          # from a real network fault.
          #
          # The two failures are then reported apart. "could not reach the index"
          # and "index reachable, version absent" mean different things to whoever
          # reads a red run: the first is infrastructure, the second is the release
          # this step exists to catch. LAST_STATE carries that distinction into the
          # final error so it survives past the per-attempt lines.
          #
          # Ten attempts with increasing backoff, 225s of waiting in total. PyPI's
          # JSON index is not immediately consistent, and a flat 50s window can go
          # red on a publish that actually succeeded.
          ATTEMPTS=10
          LAST_STATE="never ran"
          for attempt in $(seq 1 "${ATTEMPTS}"); do
            if ! curl -sf "https://pypi.org/pypi/${PKG_NAME}/json" -o /tmp/pypi.json; then
              LAST_STATE="could not reach the PyPI index"
              echo "attempt ${attempt}/${ATTEMPTS}: ${LAST_STATE}, retrying"
            elif python -c "import json,sys; sys.exit(0 if sys.argv[1] in json.load(open('/tmp/pypi.json'))['releases'] else 1)" "${PKG_VERSION}"; then
              echo "PyPI serves ${PKG_NAME}==${PKG_VERSION}"
              exit 0
            else
              LAST_STATE="index reachable but ${PKG_VERSION} is not in it"
              echo "attempt ${attempt}/${ATTEMPTS}: ${LAST_STATE}, waiting"
            fi
            if [ "${attempt}" -lt "${ATTEMPTS}" ]; then
              sleep $((attempt * 5))
            fi
          done
          echo "::error::published without error, but after ${ATTEMPTS} attempts: ${LAST_STATE} (${PKG_NAME}==${PKG_VERSION})"
          exit 1
        working-directory: clients/python
