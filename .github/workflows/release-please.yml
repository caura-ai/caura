name: release-please

# Conventional-Commits-driven release automation. On every push to main,
# release-please scans new commits and either opens/updates a release
# PR (when there are user-visible changes) or no-ops. Merging the
# release PR cuts a GitHub Release, tags the version, and updates
# CHANGELOG.md + every version-pinned file listed in
# release-please-config.json.
#
# Auth: a GitHub App installed on this repository only, with Contents,
# Pull requests and Issues write (labels) and implicit Metadata read. Its key
# is stored only in the `release-please` environment, whose deployment rule
# admits the main branch alone, so no other ref's workflow can read it. The
# minted token is further narrowed to this repository and those three
# permissions.

on:
  push:
    branches: [main]
  workflow_dispatch:

# The App token does the writing; the job's own token only needs to read.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    environment: release-please
    steps:
      # The environment's branch rule is what withholds the key from other
      # refs; this refuses anything else before a token exists.
      - name: Require this repository's main branch
        env:
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = caura-ai/caura
          test "$REPOSITORY_ID" = 1222639711
          test "$GITHUB_REF" = refs/heads/main
          case "$GITHUB_EVENT_NAME" in
            push|workflow_dispatch) ;;
            *) exit 1 ;;
          esac

      # An App token, not the default GITHUB_TOKEN: GitHub's anti-loop
      # guard means a PR opened with the default token never runs CI /
      # dco, so branch protection sees no required-check history and the
      # merge gate stays BLOCKED even after approval. An App-minted token
      # is treated as an external user and triggers workflows as expected.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: caura-ai
          repositories: caura
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
