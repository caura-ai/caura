name: Security Scan

# Gitleaks runs independently below: every PR commit, or all fetched history
# on scheduled/manual runs, including archive members. Findings fail that job.
# Static security scanning for the Python services: SAST (bandit) + dependency
# CVE audit (pip-audit). Complements the per-PR lint/type/test gate in ci.yml —
# that catches style/type/behaviour; this catches security smells and known-
# vulnerable dependencies. Runs per-PR (fast feedback) + weekly (catches newly
# disclosed CVEs in unchanged deps). CodeQL, a richer SAST, runs from codeql.yml.
#
# A finding fails the job (L-65). Both steps ran report-only (continue-on-error)
# until their backlog was triaged; what it left is fixed, or accepted below with
# the reason it does not apply. A red weekly run means a new advisory against a
# version a lock pins: bump it, or accept it here with the reason.

on:
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "1 6 * * 1" # weekly, Monday 06:01 UTC
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.9.26"

permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scan (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install the scanners
        # Pinned in .github/security-scan/requirements.txt, so a new release
        # cannot fail every PR at once; Dependabot's pip updates propose bumps.
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install -r .github/security-scan/requirements.txt
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"

      - name: Bandit SAST (medium+ severity / medium+ confidence)
        # Source only, not tests: common/ and every service's src. B104 (binding
        # to all interfaces) is skipped: every service runs in a container, where
        # it must listen on all of them. common/serve.py's --host default is such
        # a bind, and that file cannot carry a "# nosec": it is vendored, kept
        # byte-identical with caura-enterprise's copy.
        run: >-
          bandit -r common core-api/src core-storage-api/src core-operations/src core-worker/src
          --skip B104 --severity-level medium --confidence-level medium

      - name: pip-audit (known-vulnerable dependencies in each service's uv.lock)
        # Each service's lock, exported as its Dockerfile exports it (uv export
        # --frozen --no-dev) with every --extra that Dockerfile can pass: the
        # pins its images install, and not extras no image installs, such as
        # core-worker's opt-in local embedder or the dev and test tools.
        # --no-deps and --disable-pip read those pins as written, without
        # resolving or installing anything. --vulnerability-service osv: the
        # default service, PyPI's JSON feed, had no entry for mako's
        # GHSA-5639-2j2p-m4mx two weeks after OSV and the GitHub advisory
        # database published it, so the scan passed on it (L-239). OSV carries
        # both the PYSEC and the GHSA advisories.
        #
        # Accepted advisories: none. Accept one with --ignore-vuln on the
        # pip-audit line only with the reason it does not apply here, listed in
        # this comment, and drop it once a fixed release is locked.
        run: |
          vulnerable=""
          for service in core-api core-storage-api core-operations core-worker; do
            mapfile -t extras < <(grep -o -- '--extra [a-z-]*' "${service}/Dockerfile" | sort -u | sed 's/ /=/')
            uv export --frozen --no-dev "${extras[@]}" --no-emit-project --quiet \
              --directory "${service}" -o "${RUNNER_TEMP}/${service}.txt"
            echo "::group::${service} ${extras[*]}"
            pip-audit --desc --no-deps --disable-pip --vulnerability-service osv \
              -r "${RUNNER_TEMP}/${service}.txt" \
              || vulnerable="${vulnerable} ${service}"
            echo "::endgroup::"
          done
          if [ -n "${vulnerable}" ]; then
            echo "::error::Known-vulnerable dependencies in:${vulnerable}. Bump them, or accept the advisory in this step's comment with the reason it does not apply."
            exit 1
          fi

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: secret-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-pinned Gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks/archive.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks/archive.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Test commit safeguards with disposable fake credentials
        run: python3 -m unittest discover -s tests -p test_secret_scanning.py -v

      - name: Scan every PR commit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/scan_secrets.py --base "$BASE_SHA" --head "$HEAD_SHA"
          --report "$RUNNER_TEMP/secret-scan/locations.json"

      - name: Scan full fetched history and archives
        if: github.event_name != 'pull_request'
        run: >-
          python3 scripts/scan_secrets.py --all
          --report "$RUNNER_TEMP/secret-scan/locations.json"

      - name: Retain finding locations only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secret-scan-locations
          path: ${{ runner.temp }}/secret-scan/locations.json
          if-no-files-found: warn
          retention-days: 7
