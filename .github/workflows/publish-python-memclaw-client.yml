name: Publish memclaw-client to PyPI # legacy-name-ok: the retired distribution name this workflow publishes as a redirect shell

# Publishes `clients/memclaw-client-shim` — the former client name, held on # legacy-name-ok: names the directory of the redirect shell
# PyPI as an empty redirect shell that installs `caura-client`. Trusted
# publishing (OIDC), no token.
#
# WHY THIS WORKFLOW EXISTS. The shell's earlier releases were published by
# hand and 0.5.0 was then yanked with a summary that no longer told the truth.
# A yanked release's text cannot be edited, so correcting the page means a new
# release, and a name we hold for supply-chain reasons must be releasable from
# CI like every other client artifact in this repo.
#
# NAMED FOR WHAT IT PUBLISHES — see the same note in `publish-python-sdk.yml`.
#
# One-time setup by a maintainer:
#   1. The project ALREADY EXISTS on PyPI, so this is not a pending publisher.
#      Add it under Manage → the project → Publishing → Add a new publisher:
#      repo `caura-ai/caura`, workflow `publish-python-memclaw-client.yml`, # legacy-name-ok: this workflow's own filename
#      environment `pypi`.
#   2. The GitHub environment `pypi` already exists for
#      `publish-python-client.yml`; this workflow reuses it.
#
# Release: bump the version in clients/memclaw-client-shim/pyproject.toml, then # legacy-name-ok: names the directory of the redirect shell
# push a tag `memclaw-client-v<version>` (or run this workflow manually). # legacy-name-ok: the tag pattern for the redirect shell

on:
  push:
    tags:
      - "memclaw-client-v*" # legacy-name-ok: the redirect shell this workflow publishes
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI trusted publishing
    steps:
      # Trusted publishing has no stored token to check. GitHub exposes both
      # request variables only when this job can obtain an OIDC credential.
      # Check the context without minting a live token in this step.
      - name: The publish credential must be obtainable
        run: |
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" ]]; then
            echo "::error::No OIDC token-request context, so PyPI trusted publishing cannot authenticate. This job needs 'permissions: id-token: write'; there is no stored token to fall back on."
            exit 1
          fi
          echo "OIDC token-request context is present"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # This package was created under the Caura name and has no legacy tag
      # history, so tag-triggered releases accept only memclaw-client-v*. # legacy-name-ok: the redirect shell this workflow publishes
      - name: The tag must agree with pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [[ "${GITHUB_REF_NAME}" != memclaw-client-v* ]]; then # legacy-name-ok: the redirect shell this workflow publishes
            echo "::error::tag ${GITHUB_REF_NAME} must start with memclaw-client-v" # legacy-name-ok: the redirect shell this workflow publishes
            exit 1
          fi
          TAG_VERSION="${GITHUB_REF_NAME#memclaw-client-v}" # legacy-name-ok: the redirect shell this workflow publishes
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} says ${TAG_VERSION} but pyproject.toml says ${PKG_VERSION}"
            exit 1
          fi
          echo "publishing $(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")==${PKG_VERSION}"
        working-directory: clients/memclaw-client-shim # legacy-name-ok: the redirect shell this workflow publishes
      # The README source carries legacy-name lint markers as HTML comments so
      # the rename ratchet can account for each mention of the former name. They
      # are not for readers: PyPI's JSON API serves the long description raw, so
      # they would leak into every page an AI answer engine reads. Strip them
      # before building, and refuse to publish if any HTML comment survives.
      - name: Strip lint markers from the README
        run: |
          sed -E -i 's/ *<!-- legacy-name-[a-z]+:[^>]*-->//g' README.md
          if grep -q '<!--' README.md; then
            echo "::error::README.md still contains an HTML comment; it would be published verbatim"
            exit 1
          fi
        working-directory: clients/memclaw-client-shim # legacy-name-ok: the redirect shell this workflow publishes
      - name: Build
        run: |
          pip install build packaging
          python -m build
        working-directory: clients/memclaw-client-shim # legacy-name-ok: the redirect shell this workflow publishes
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: clients/memclaw-client-shim/dist/ # legacy-name-ok: the redirect shell this workflow publishes

      - name: PyPI must actually serve it
        run: |
          PKG_NAME=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          PKG_VERSION=$(python -c "import tomllib; from packaging.version import Version; print(Version(tomllib.load(open('pyproject.toml','rb'))['project']['version']))")
          # Ask for the project and test version membership. PyPI's missing-
          # version endpoint can make curl report exit 56, which cannot be
          # distinguished from a genuine network failure.
          ATTEMPTS=10
          LAST_STATE="never ran"
          for attempt in $(seq 1 "${ATTEMPTS}"); do
            if ! HTTP_STATUS=$(curl -sSL --connect-timeout 5 --max-time 15 "https://pypi.org/pypi/${PKG_NAME}/json" -o /tmp/pypi.json -w "%{http_code}"); then
              LAST_STATE="could not reach the PyPI index"
              echo "attempt ${attempt}/${ATTEMPTS}: ${LAST_STATE}, retrying"
            elif [ "${HTTP_STATUS}" = "404" ]; then
              LAST_STATE="index reachable but project ${PKG_NAME} is not in it"
              echo "attempt ${attempt}/${ATTEMPTS}: ${LAST_STATE}, waiting"
            elif [[ "${HTTP_STATUS}" != 2?? ]]; then
              LAST_STATE="index reachable but returned HTTP ${HTTP_STATUS}"
              echo "attempt ${attempt}/${ATTEMPTS}: ${LAST_STATE}, retrying"
            elif python -c "import json,sys; releases=json.load(open('/tmp/pypi.json'))['releases']; sys.exit(2 if not isinstance(releases,dict) else (0 if sys.argv[1] in releases else 3))" "${PKG_VERSION}"; then
              echo "PyPI serves ${PKG_NAME}==${PKG_VERSION}"
              exit 0
            else
              CHECK_STATUS=$?
              if [ "${CHECK_STATUS}" -eq 3 ]; then
                LAST_STATE="index reachable but ${PKG_VERSION} is not in it"
                echo "attempt ${attempt}/${ATTEMPTS}: ${LAST_STATE}, waiting"
              else
                LAST_STATE="index reachable but its response could not be checked"
                echo "attempt ${attempt}/${ATTEMPTS}: ${LAST_STATE}, retrying"
              fi
            fi
            if [ "${attempt}" -lt "${ATTEMPTS}" ]; then
              sleep $((attempt * 5))
            fi
          done
          echo "::error::published without error, but after ${ATTEMPTS} attempts: ${LAST_STATE} (${PKG_NAME}==${PKG_VERSION})"
          exit 1
        working-directory: clients/memclaw-client-shim # legacy-name-ok: the redirect shell this workflow publishes
