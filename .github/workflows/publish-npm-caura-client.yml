name: Publish the caura-client alias

# Publishes `clients/npm-caura-client` — UNSCOPED `caura-client`, an alias that
# re-exports the canonical implementation package `@caura/client`.
#
# WHY THIS PACKAGE EXISTS. The Python client is `pip install caura-client`, so
# `npm install caura-client` is a name people will guess — and an UNSCOPED npm
# name is publishable by any third party, which makes an unclaimed one the
# npm half of the supply-chain hole the PyPI aliases already closed. Owning it
# keeps a guessed install line resolving to the canonical package instead of
# to whoever claims it first. (The bare name `caura` needs no such defense:
# npm's name-similarity filter blocks it against `csurf` for EVERY publisher,
# no exception process — npm support, 2026-08-28. Recorded as not-happening;
# `@caura/client` is canonical.)
#
# GATES. Same shape as publish-npm-sdk.yml: credential obtainable, tag agrees
# with package.json, dependencies already on the registry, publish, verify the
# registry actually serves it. Consolidating this shape into a reusable
# `workflow_call` remains the right end state, just not done yet.
#
# AUTH. npm trusted publishing (OIDC): no stored token exists. The `build` job
# checks out the tag, proves it is on main, runs the checks below and packs
# with no credential at all; only the `publish` job can mint the OIDC token npm
# accepts, and it runs no repository code, only the pinned setup and `npm
# publish` of the packed tarball. It runs in the `npm` environment.
#
# One-time setup by a maintainer:
#   1. The GitHub environment `npm`, shared with `publish-npm-client.yml`: see
#      the setup there.
#   2. On npmjs.com, add a trusted publisher to the package: GitHub Actions,
#      organization `caura-ai`, repository `caura`, environment `npm`,
#      workflow `publish-npm-caura-client.yml`. Then set the package's publishing
#      access to require two-factor authentication and disallow tokens.
#
# Release: bump the version in clients/npm-caura-client/package.json, then
# push a tag `npm-caura-client-v<version>`, or run this workflow from main
# naming an existing tag.
# v1.0.0 was published manually by a maintainer on 2026-09-08.

on:
  push:
    tags:
      - "npm-caura-client-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re-)publish, e.g. npm-caura-client-v1.0.0"
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.package.outputs.name }}
      version: ${{ steps.package.outputs.version }}
    defaults:
      run:
        working-directory: clients/npm-caura-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          # The whole history, so main is there to compare the tag against.
          fetch-depth: 0
          persist-credentials: false

      # A tag can name any commit, and a release or a manual run can name any
      # tag. Build only a commit main already contains.
      - name: The tag must point at a commit on main
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::$(git rev-parse HEAD) is not on main. Only a tag on a commit main already contains is published."
            exit 1
          fi
          echo "$(git rev-parse HEAD) is on main"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      # On a manual run as on a tag push.
      - name: The tag must agree with package.json
        run: |
          if [[ "${RELEASE_TAG}" != npm-caura-client-v* ]]; then
            echo "::error::tag ${RELEASE_TAG} must start with npm-caura-client-v"
            exit 1
          fi
          TAG_VERSION="${RELEASE_TAG#npm-caura-client-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "::error::tag ${RELEASE_TAG} says ${TAG_VERSION} but package.json says ${PKG_VERSION}"
            exit 1
          fi
          echo "publishing $(node -p "require('./package.json').name")@${PKG_VERSION}"

      # npm does not resolve dependencies at publish time: publishing against a
      # version that is not on the registry SUCCEEDS and produces a package that
      # fails for the first person who installs it.
      - name: Every dependency must already be on the registry
        run: |
          node -p "Object.entries(require('./package.json').dependencies || {}).map(([n, r]) => n + '@' + r).join('\n')" \
            > /tmp/deps.txt
          while read -r SPEC; do
            [[ -z "$SPEC" ]] && continue
            RESOLVED=""
            for attempt in 1 2 3 4 5; do
              # `|| true` is load-bearing: steps run under `bash -eo pipefail`,
              # so an unresolvable spec would abort the step on attempt 1 and
              # the retry would be decorative. The type check matters too —
              # npm prints its E404 as valid JSON on stdout under `--json`, so
              # a successful parse proves nothing about existence.
              RESOLVED=$(npm view "$SPEC" version --json 2>/dev/null | node -e '
                let s = "";
                process.stdin.on("data", d => s += d).on("end", () => {
                  try {
                    const j = JSON.parse(s);
                    const a = Array.isArray(j) ? j : [j];
                    const last = a[a.length - 1];
                    console.log(typeof last === "string" ? last : "");
                  } catch { console.log(""); }
                });' || true)
              [[ -n "$RESOLVED" ]] && break
              echo "attempt ${attempt}: ${SPEC} not visible yet, waiting"
              sleep 10
            done
            if [[ -z "$RESOLVED" ]]; then
              echo "::error::${SPEC} is not on the registry. Publish it first (publish-npm-client.yml) — npm would accept this package anyway and it would be uninstallable."
              exit 1
            fi
            echo "${SPEC} -> ${RESOLVED}"
          done < /tmp/deps.txt

      - name: Record the package name and version
        id: package
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: |
          mkdir -p "${RUNNER_TEMP}/package"
          npm pack --ignore-scripts --pack-destination "${RUNNER_TEMP}/package"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error

  # Holds the permission, so it runs only the pinned setup, the credential
  # check, the publish of the tarball built above and the registry check.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/${{ needs.build.outputs.name }}/v/${{ needs.build.outputs.version }}
    permissions:
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing has no stored token to check. It needs an OIDC
      # token-request context, which GitHub provides only to a job holding
      # `id-token: write`, and npm 11.5.1 or later. Without either, `npm
      # publish` fails late with an authentication error that reads like an
      # npm-side problem. Checked without minting a token in this step.
      - name: The publish credential must be obtainable
        run: |
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "::error::No OIDC token-request context, so npm trusted publishing cannot authenticate. This job needs 'permissions: id-token: write'; there is no stored token to fall back on."
            exit 1
          fi
          NPM_VERSION=$(npm --version)
          if ! printf '11.5.1\n%s\n' "${NPM_VERSION}" | sort -V -C; then
            echo "::error::npm ${NPM_VERSION} cannot use trusted publishing, which needs npm 11.5.1 or later"
            exit 1
          fi
          echo "OIDC token-request context is present; npm ${NPM_VERSION}"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: package/

      # A tarball runs no lifecycle scripts when published; --ignore-scripts
      # says so explicitly. The leading ./ is load-bearing: npm reads
      # `package/<name>.tgz` as a GitHub `owner/repo` shorthand, not a file.
      - name: Publish
        run: |
          shopt -s nullglob
          TARBALLS=(./package/*.tgz)
          if [[ "${#TARBALLS[@]}" -ne 1 ]]; then
            echo "::error::expected one packed tarball, found ${#TARBALLS[@]}"
            exit 1
          fi
          npm publish "${TARBALLS[0]}" --access public --provenance --ignore-scripts

      # A green publish step is not evidence the registry serves it.
      - name: The registry must serve what we just published
        env:
          PKG_NAME: ${{ needs.build.outputs.name }}
          PKG_VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Give the registry five minutes, not fifty seconds. The run for
          # caura-client-ts-v1.0.2 (actions/runs/35459496398, 2026-09-19)
          # published cleanly, polled 5 x 10 s, went red — and the registry was
          # serving 1.0.2 a couple of minutes later. `--prefer-online` matters
          # as much as the budget: the registry answers packuments with
          # `cache-control: max-age=300`, so without it npm can satisfy every
          # retry from the packument it cached on attempt 1, which predates
          # the publish becoming visible.
          ATTEMPTS=20
          INTERVAL=15
          START=$SECONDS
          for attempt in $(seq 1 "$ATTEMPTS"); do
            SERVED=$(npm view --prefer-online "${PKG_NAME}@${PKG_VERSION}" version --json 2>/dev/null | node -e '
              let s = "";
              process.stdin.on("data", d => s += d).on("end", () => {
                try {
                  const j = JSON.parse(s);
                  const a = Array.isArray(j) ? j : [j];
                  const last = a[a.length - 1];
                  console.log(typeof last === "string" ? last : "");
                } catch { console.log(""); }
              });' || true)
            [[ -n "$SERVED" ]] && { echo "registry serves ${PKG_NAME}@${SERVED} after $((SECONDS - START))s"; exit 0; }
            echo "attempt ${attempt}/${ATTEMPTS} ($((SECONDS - START))s elapsed): not served yet, waiting ${INTERVAL}s"
            sleep "$INTERVAL"
          done
          echo "::error::${PKG_NAME}@${PKG_VERSION} is not being served $((SECONDS - START))s after publish."
          exit 1
