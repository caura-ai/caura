name: CI

on:
  pull_request:
    branches: [main, dev]

env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.9.26"

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: memclaw
          POSTGRES_USER: memclaw
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memclaw"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (for plugin version-sync + type-check)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Check plugin version-sync (gen-version.sh → src/version.ts)
        # Fails fast if plugin/src/version.ts has drifted from
        # plugin/package.json's "version" field — i.e., someone bumped
        # package.json but didn't run scripts/gen-version.sh, or hand-
        # edited version.ts. The drift-prevention guarantee documented
        # in scripts/gen-version.sh is enforced here.
        run: cd plugin && npm run check:version

      - name: Type-check + build plugin (tsc)
        # Compiles the plugin with its own tsconfig so a dependency bump that
        # breaks the build (e.g. a TypeScript major that changes @types
        # resolution) can't merge while looking green. The version-sync check
        # above runs no compiler; `client-typescript-ci.yml` is path-scoped to
        # the client SDK, not /plugin — so without this step the plugin has no
        # type-check gate in CI.
        run: cd plugin && npm ci && npm run build

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        # core-operations is installed for its own ruff/mypy/pytest steps
        # below. Before it was listed here those steps passed only because
        # core-api's dependency list happens to be a superset of
        # core-operations' runtime deps — an undeclared coupling that would
        # have broken confusingly the first time core-operations grew a
        # dependency core-api lacks. Resolution cost of adding it: one extra
        # package (119 vs 118).
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e core-storage-api/[dev] -e core-api/[dev] -e core-operations/[dev]
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH

      # --- Broker↔cloud API-versioning gate (Gate C / Phase 1, deliverables A+B) ---
      # core-api/openapi.broker.json is the FROZEN v1 contract for the
      # broker-facing gateway operations that memclawd calls against Caura
      # cloud. The authoritative list is BROKER_OPERATIONS in
      # core-api/scripts/gen_broker_openapi.py — deliberately not duplicated
      # here, because this comment listed four endpoints while the broker had
      # grown to eight, and a list in a comment is exactly what goes stale.
      # It is a subset of the full ~91-path
      # OpenAPI surface, with info normalized to the frozen contract version so
      # it changes ONLY when a broker endpoint's shape changes. Regenerate with
      # `python core-api/scripts/gen_broker_openapi.py` and commit the result;
      # breaking changes require a deliberate contract bump per the RFC
      # (see core-api/scripts/README.md).
      - name: Broker OpenAPI baseline is current (freeze v1)
        # Regenerates the broker-contract subset from the live app and fails if
        # the committed baseline is stale vs the code on this branch.
        run: uv run python core-api/scripts/gen_broker_openapi.py --check
        env:
          # core_api is installed editable above; `.` puts the repo root on the
          # path for the `common` package (mirrors the test/migration steps).
          PYTHONPATH: core-api/src:core-storage-api/src:.

      - name: Broker OpenAPI has no breaking change vs main
        # oasdiff compares main's committed baseline (base) against this branch's
        # baseline (revision) and fails on any BREAKING change (removed path or
        # param, new required request field, narrowed type, ...). oasdiff is
        # pinned to the tufin/oasdiff Docker image by tag; `--fail-on ERR` is
        # required for a non-zero exit on breaking changes. On the very first
        # merge main has no baseline yet — the gate detects that and skips.
        run: |
          set -euo pipefail
          # caura-memclaw is public, so anonymous fetch works even though
          # actions/checkout ran with persist-credentials: false.
          git fetch --no-tags --depth=1 origin main
          if git cat-file -e origin/main:core-api/openapi.broker.json 2>/dev/null; then
            work="$RUNNER_TEMP/oasdiff"
            mkdir -p "$work"
            git show origin/main:core-api/openapi.broker.json > "$work/base.json"
            cp core-api/openapi.broker.json "$work/revision.json"
            # Pinned by digest (not just the mutable :v1.26.0 tag) so a retagged
            # image can't silently exit 0 and hollow out the gate.
            docker run --rm -v "$work:/specs:ro" \
              tufin/oasdiff:v1.26.0@sha256:95a3f551ebecb6fd0fed3ff0f078bba3d51b66b379c4ca811370652d7e4d0cef \
              breaking /specs/base.json /specs/revision.json --fail-on ERR
          else
            echo "No broker baseline on main yet (first-merge bootstrap) — skipping breaking-change gate."
          fi

      - name: Run Ruff linter (core-api)
        run: uv run ruff check core-api/src/

      - name: Run Ruff linter (core-storage-api)
        run: uv run ruff check core-storage-api/src/

      - name: Run Ruff linter (core-storage-api tests)
        # The test tree was unlinted for as long as it was un-run; both halves
        # of that blind spot close together or it just drifts again.
        run: uv run ruff check core-storage-api/tests/

      - name: Run Ruff linter (common)
        # common/ had NO ruff config above it (no ruff.toml, no root
        # pyproject.toml), so ruff fell back to built-in DEFAULTS here — the rule
        # set was "whatever the installed ruff version ships," and it changed
        # under us on the 0.16.0 bump. common/ruff.toml pins it (#684).
        #
        # DO NOT add ``--config common/ruff.toml``. #685 did, reasoning that
        # naming the config made the step immune to discovery changes; it instead
        # broke every per-file-ignore silently. Those patterns are relative to the
        # config's own directory under discovery (so ``llm/retry.py`` means
        # ``common/llm/retry.py``), but ``--config`` resolves them against the CWD
        # instead — from the repo root nothing matches, all per-file-ignores
        # become inert, and the step fails on exactly the findings they exempt.
        # Discovery is also what enterprise's equivalent step uses, which matters
        # because the config is byte-identical across both repos (#696).
        run: uv run ruff check common/

      - name: Run Ruff linter (core-operations)
        # Paired with the test step below: an unlinted tree drifts, and this one
        # was both unlinted and unrun. core-operations/pyproject.toml declares
        # its own line-length = 110, matching core-api and core-storage-api
        # rather than common/'s 88, so the format check below is safe to gate.
        run: uv run ruff check core-operations/src/ core-operations/tests/

      - name: Run Ruff formatter check (core-api)
        run: uv run ruff format --check core-api/src/

      - name: Run Ruff formatter check (core-storage-api)
        run: uv run ruff format --check core-storage-api/src/

      - name: Run Ruff formatter check (core-storage-api tests)
        run: uv run ruff format --check core-storage-api/tests/

      - name: Run Ruff formatter check (core-operations)
        run: uv run ruff format --check core-operations/src/ core-operations/tests/

      - name: Run Ruff formatter check (vendored common/ files at ruff defaults)
        # This list mirrors the policy=identical entries of caura-memclaw-enterprise's
        # scripts/vendored_files_manifest.json — the source of truth; keep in sync.
        # Enterprise CI format-checks the vendored copies at ruff DEFAULTS (88 cols),
        # so gate them here too or a merge turns enterprise CI red until a reflow
        # lands (full story: the vendoring note in common/structlog_config.py's
        # docstring). ``--isolated`` pins default behavior regardless of any ruff
        # config in scope — which now includes common/ruff.toml (added in #684),
        # so this step is deliberately unaffected by it. Still NOT all of common/:
        # only the policy=identical files owe byte-parity to enterprise. Note
        # common/ruff.toml also sets line-length = 88, so the two agree today;
        # ``--isolated`` is what guarantees they cannot silently diverge.
        run: uv run ruff format --check --isolated common/__init__.py common/structlog_config.py common/serve.py

      - name: Guard against raw-string MCP error returns (audit B4 / CAURA-000 #147)
        # MCP tool handlers must build error envelopes via ``_error_response(...)``
        # so ``_with_latency`` can flip ``CallToolResult.isError = True``. Raw
        # ``"Error: ..."`` / ``"Error (NNN): ..."`` returns slip past the
        # JSON-shape detector and reach the client as ``isError=False`` —
        # the exact regression we keep closing. Fail CI if any reappear.
        run: |
          # Match both double- and single-quoted forms, with optional f-string
          # prefix. ``grep -n`` prefixes each hit with ``LINE:`` so the
          # comment-skip filter anchors on ``^[0-9]+:\s*#``.
          if grep -nE '[f]?"Error(:| \()' core-api/src/core_api/mcp_server.py | grep -vE '^[0-9]+:\s*#'; then
            echo "::error::Raw-string MCP error return found (double-quote). Use _error_response(code, message) instead — see tests/test_mcp_iserror_propagation.py."
            exit 1
          fi
          if grep -nE "[f]?'Error(:| \()" core-api/src/core_api/mcp_server.py | grep -vE '^[0-9]+:\s*#'; then
            echo "::error::Raw-string MCP error return found (single-quote). Use _error_response(code, message) instead — see tests/test_mcp_iserror_propagation.py."
            exit 1
          fi

      - name: Run mypy (core-api)
        run: cd core-api && uv run mypy src/

      - name: Run mypy (core-storage-api)
        run: cd core-storage-api && uv run mypy src/

      - name: Run mypy (core-operations)
        # core-operations/pyproject.toml carries a full [tool.mypy] block and
        # mypy as a dev dep, same as its two siblings above; only the CI step
        # was missing.
        run: cd core-operations && uv run mypy src/

      - name: Enable pgvector extension
        run: PGPASSWORD=changeme psql -h localhost -U memclaw -d memclaw -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run migrations
        run: alembic upgrade head
        env:
          PYTHONPATH: core-api/src:core-storage-api/src:.
          POSTGRES_HOST: localhost
          POSTGRES_USER: memclaw
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: memclaw
          POSTGRES_REQUIRE_SSL: "false"

      - name: Run tests
        run: |
          uv run pytest tests/ \
            -v --tb=short -m "not benchmark" \
            --cov=core-api/src/core_api \
            --cov=core-storage-api/src/core_storage_api \
            --cov-report=xml \
            --cov-report=term-missing
        env:
          PYTHONPATH: core-api/src:core-storage-api/src:.
          POSTGRES_HOST: localhost
          POSTGRES_USER: memclaw
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: memclaw
          POSTGRES_REQUIRE_SSL: "false"
          TEST_DATABASE_URL: "postgresql+asyncpg://memclaw:changeme@localhost:5432/memclaw"
          EMBEDDING_PROVIDER: fake
          ENTITY_EXTRACTION_PROVIDER: none
          USE_LLM_FOR_MEMORY_CREATION: "false"

      - name: Enforce coverage floors (per package)
        # The step above collects coverage but enforced no floor. Both packages
        # declare ``[tool.coverage.report] fail_under = 50``, and coverage
        # discovers config relative to the CWD — with no root pyproject.toml,
        # running pytest from the repo root meant neither floor was ever read.
        # Measured at the time of writing: core-api 83%, core-storage-api 67%.
        #
        # Enforced PER PACKAGE rather than on the combined total, because the
        # blend is dominated by core-api (15,156 statements against 5,558) and
        # would mask a collapse in the smaller one: core-storage-api falling to
        # 30% still leaves a combined ~69%, comfortably over a 50% blended
        # floor. Two declarations mean two floors.
        #
        # ``--rcfile`` points at each package's own pyproject so the number
        # lives in exactly one place; hardcoding 50 here would let the workflow
        # drift from the declaration it is meant to enforce. Reuses the data
        # file the pytest run just wrote, so the suite is not run twice.
        #
        # Both reports run unconditionally, via ``|| status=1`` rather than
        # back-to-back commands: GitHub runs a multi-line ``run`` under
        # ``bash -e``, so a core-api breach would abort the step and a
        # simultaneous core-storage-api breach would stay invisible until the
        # first was fixed. Exiting once at the end keeps the step failing on
        # either breach while always reporting both.
        run: |
          status=0
          uv run coverage report \
            --rcfile=core-api/pyproject.toml \
            --include="core-api/src/core_api/*" || status=1
          uv run coverage report \
            --rcfile=core-storage-api/pyproject.toml \
            --include="core-storage-api/src/core_storage_api/*" || status=1
          exit "$status"

      - name: Create the storage-suite database
        # Its own database, NOT the one `tests/` uses. The two suites provision
        # differently — `tests/` conftest calls Base.metadata.create_all, the
        # storage conftest runs the real Alembic chain via init_database(). On a
        # shared database whichever ran first would win: create_all going first
        # leaves tables with no alembic_version, so init_database() stamps head
        # and skips the migrations, and every migration-only table (e.g.
        # tenant_suppression, which has no ORM model) stays missing. Isolating
        # removes that ordering coupling instead of relying on step order.
        #
        # Idempotent: Postgres has no CREATE DATABASE IF NOT EXISTS, so this
        # guards on pg_database and creates only when absent. Fed via stdin
        # rather than -c because \gexec is a psql meta-command and -c sends
        # its argument as a single SQL string (where \gexec is a syntax
        # error). ON_ERROR_STOP=1 is kept deliberately over the simpler
        # `|| true`, which would also swallow a genuine connection or auth
        # failure and defer the confusion to the pytest step below.
        run: |
          PGPASSWORD=changeme psql -h localhost -U memclaw -d memclaw -v ON_ERROR_STOP=1 <<'SQL'
          SELECT 'CREATE DATABASE memclaw_storage'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'memclaw_storage')\gexec
          SQL

      - name: Run core-storage-api integration tests
        run: uv run pytest core-storage-api/tests/ -v --tb=short
        env:
          PYTHONPATH: core-api/src:core-storage-api/src:.
          POSTGRES_REQUIRE_SSL: "false"
          # This suite reads DATABASE_URL (not TEST_DATABASE_URL) — its conftest
          # migrates whatever core_storage_api.config points at.
          DATABASE_URL: "postgresql+asyncpg://memclaw:changeme@localhost:5432/memclaw_storage"
          EMBEDDING_PROVIDER: fake
          ENTITY_EXTRACTION_PROVIDER: none
          USE_LLM_FOR_MEMORY_CREATION: "false"

      - name: Run core-operations tests
        # This tree was unrun for as long as it was unlinted — the same blind
        # spot the core-storage-api ruff step above describes, and both halves
        # close here. It covers the cron-scheduling surface: wall-clock
        # alignment, per-job *_run_at_hour threading, the fanout POST paths and
        # the scheduler's failure/hot-loop guards.
        #
        # No env needed, deliberately. core-operations/pytest.ini sets its own
        # ``pythonpath = src ..`` (src for core_operations, .. for common) and
        # pytest resolves that file as the configfile for this path, so it does
        # NOT inherit the root pytest.ini. Adding PYTHONPATH here would be
        # inert. These tests touch no database either — the Postgres service is
        # already up for the steps above, but nothing here uses it, so the step
        # costs well under a second.
        #
        # ``--cov-config`` is load-bearing, not decoration. core-operations
        # declares ``[tool.coverage.report] fail_under = 50``, but coverage
        # discovers config relative to the CWD and there is no root
        # pyproject.toml — so running from the repo root without this flag
        # collects coverage while silently ignoring the floor. With it, the run
        # prints "Required test coverage of 50.0% reached" and fails below it.
        # Currently ~80%.
        run: |
          uv run pytest core-operations/tests/ -v --tb=short \
            --cov=core-operations/src/core_operations \
            --cov-config=core-operations/pyproject.toml \
            --cov-report=term-missing
        env:
          # Keep this run's data file separate from the root suite's, which
          # uploads coverage.xml to Codecov.
          COVERAGE_FILE: .coverage.core-operations

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Build packages
        # core-operations included now that CI installs, lints, type-checks and
        # tests it — a broken pyproject/build-backend would otherwise surface
        # only in its Docker build.
        run: |
          cd core-api && uv build && cd ..
          cd core-storage-api && uv build && cd ..
          cd core-operations && uv build

  image-version:
    # Guards the /api/v1/version surface end-to-end: builds the actual
    # core-api image and asserts it bakes a real semver (== pyproject),
    # not "dev". This is the regression that silently shipped for weeks —
    # the prod Dockerfile installs deps via ``uv export --no-emit-project``
    # so core-api is never installed as a package, leaving importlib.metadata
    # with nothing to resolve → "dev". A pytest check can't catch it: CI
    # installs core-api editable, so the bug only exists inside the built
    # image. See core-api/Dockerfile version stamp +
    # core_api.constants._resolve_version().
    name: core-api image bakes a real version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build core-api image
        run: docker build --platform linux/amd64 --target runtime -t core-api-versiontest -f core-api/Dockerfile .

      - name: Assert baked version is a real semver matching pyproject
        run: |
          BAKED=$(docker run --rm core-api-versiontest python -c "from core_api.constants import VERSION; print(VERSION)")
          EXPECTED=$(python3 -c "import tomllib; print(tomllib.load(open('core-api/pyproject.toml','rb'))['project']['version'])")
          echo "baked=$BAKED expected=$EXPECTED"
          if [ "$BAKED" = "dev" ] || ! echo "$BAKED" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::core-api image did not bake a real semver (got '$BAKED'). /api/v1/version would serve a bogus value — see core-api/Dockerfile + core_api.constants._resolve_version."
            exit 1
          fi
          if [ "$BAKED" != "$EXPECTED" ]; then
            echo "::error::baked version '$BAKED' != pyproject '$EXPECTED' — the version stamp drifted from the source of truth."
            exit 1
          fi

      # Same class of bug as the version stamp above, and equally invisible to
      # pytest: CI installs core-api editable, so a module that is only present
      # transitively still imports fine in the test job while being absent from
      # the built image. numpy was exactly this — it arrived via pgvector <0.5.0,
      # and when 0.5.0 made it optional the insights discover mode silently
      # degraded to its non-clustered fallback in production for days (the
      # fallback logs a warning but the run still reports success). Assert the
      # modules the runtime code imports directly are actually in the image.
      - name: Assert directly-imported runtime deps are present in the image
        run: |
          docker run --rm core-api-versiontest python -c "import numpy; print('numpy', numpy.__version__)" || {
            echo "::error::numpy is missing from the core-api image — insights discover mode would silently fall back to non-clustered analysis. It must stay declared in core-api/pyproject.toml (see services/insights_service.py::_numpy_kmeans)."
            exit 1
          }
