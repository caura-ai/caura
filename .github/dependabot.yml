# Dependabot config — weekly security and version update PRs.
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Labels follow .github/labels.yml taxonomy: every PR is `kind/chore` +
# `dependencies` + the relevant `area/*` so it routes through triage
# and gets surfaced in release-please's Dependencies section.
#
# Each ecosystem opens at most TWO PRs per run: one `*-minor-patch` group and one
# `*-majors` group. Majors stay OUT of the minor/patch group so a breaking bump is never
# smuggled in with routine ones, but they are batched together rather than one-PR-each —
# a fleet of individual major PRs was the main source of backlog (15 open bot PRs, 2026-07).
# The uv services share ONE multi-directory entry for the same reason: four separate
# entries emitted four near-identical group PRs every week.
# Mirrors the caura-memclaw-enterprise grouping strategy.

version: 2

updates:
  # --- Python: root requirements.txt ---
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "kind/chore"
      - "area/infra"
    commit-message:
      prefix: "deps"
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]
      # Majors batched into one reviewable PR instead of one PR per dependency.
      pip-majors:
        update-types: ["major"]

  # --- Python (uv): the four core services, ONE entry across all their directories ---
  # uv (not pip): these services install FROZEN from their committed uv.lock, so only the
  # uv ecosystem bumps the lock and pyproject together (pip would leave the lock stale).
  # ONE entry with `directories` (not four separate entries): four entries emitted four
  # near-identical `uv-minor-patch` group PRs every week — the single biggest contributor
  # to the backlog. One entry means one grouped PR spanning whichever services changed.
  - package-ecosystem: "uv"
    directories:
      - "/core-api"
      - "/core-storage-api"
      - "/core-worker"
      - "/core-operations"
    # Only touch a requirement in pyproject.toml when the new version actually
    # falls outside it. The default (`increase`) raises the floor on every
    # release even when the existing range already permits the new version, and
    # each of those produced its own ungroupable PR: eight were open at once,
    # e.g. `uvicorn[standard] >=0.51.0,<1` widened to `>=0.52.0,<1` — for a
    # version the old range already allowed. The uv.lock in each of these four
    # directories was already being updated correctly; the manifest edit on top
    # of it was pure churn.
    #
    # Grouping cannot absorb them: `update-types` classifies the semver bump of
    # a resolved version, and a floor-raise on an already-satisfied range has no
    # such classification. That is why uv-minor-patch groups the lock updates
    # into one PR while these arrived individually.
    #
    # This works HERE because these specs are capped (22 of 30 in core-api carry
    # an upper bound), so "not necessary" is a meaningful state and a genuine
    # case still files — uvicorn 1.0 against `<1` needs the manifest changed and
    # will get a PR. Do NOT copy this to the `pip` entry above or to caura-ops:
    # their requirements are open-ended `>=X`, nothing is ever outside them, and
    # the setting would silence Python updates entirely rather than de-duplicate
    # them. Those need a committed lock instead (caura-ops did that on
    # 2026-08-09).
    versioning-strategy: increase-if-necessary
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "kind/chore"
      - "area/core-api"
      - "area/core-storage-api"
      - "area/core-worker"
      - "area/core-operations"
    commit-message:
      prefix: "deps"
    groups:
      uv-minor-patch:
        update-types: ["minor", "patch"]
      # Majors batched into one reviewable PR instead of one PR per dependency.
      uv-majors:
        update-types: ["major"]

  # --- npm: root (Playwright e2e) ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "kind/chore"
      - "area/infra"
    commit-message:
      prefix: "deps"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
      npm-majors:
        update-types: ["major"]

  # --- npm: plugin ---
  - package-ecosystem: "npm"
    directory: "/plugin"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "kind/chore"
      - "area/plugin"
    commit-message:
      prefix: "deps(plugin)"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
      npm-majors:
        update-types: ["major"]

  # --- GitHub Actions ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "kind/chore"
      - "area/infra"
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # e.g. actions/setup-python 5->7 and release-please-action 4->5 arrived as two
      # separate PRs; batched they are one review.
      actions-majors:
        patterns: ["*"]
        update-types: ["major"]

  # --- Docker ---
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "kind/chore"
      - "area/infra"
    commit-message:
      prefix: "deps(docker)"
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
      docker-majors:
        update-types: ["major"]
